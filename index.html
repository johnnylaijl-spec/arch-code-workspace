<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>築規單機版｜建築法規與基地條件管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f4;color:#293c39;font:14px/1.65 Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button,a,select{cursor:pointer}button{border:1px solid #d9e0dc;background:white;color:#3b5049;border-radius:6px;padding:9px 15px;transition:.15s}button:hover{background:#edf2ed;border-color:#a7b7ad}button.primary{background:#285b46;color:white;border-color:#285b46}button.primary:hover{background:#1c4836}button.link{border:0;background:transparent;padding:3px;color:#2f6c50}a{color:#32684d;text-decoration:none}.sidebar{width:226px;position:fixed;inset:0 auto 0 0;background:#fff;border-right:1px solid #e0e5df;padding:30px 20px;display:flex;flex-direction:column}.brand{font-size:35px;display:flex;gap:12px;align-items:center;color:#24583f;padding:0 12px}.brand b{font-size:27px;letter-spacing:4px;line-height:1.3}.brand span{display:block;font-size:9px;letter-spacing:2px;font-weight:500;margin-top:6px}.workspace{border-block:1px solid #e5e8e2;margin:30px 0 24px;padding:19px 13px;font-weight:bold;font-size:13px}.workspace small,.sidebottom small{display:block;color:#8a958d;font-size:11px;font-weight:normal;margin-top:5px}.navlabel{font-size:10px;color:#98a197;letter-spacing:2px;margin:0 13px 12px}nav button{width:100%;text-align:left;border:0;background:none;margin:3px 0;padding:11px 14px;font-size:13px;display:flex;gap:12px;align-items:center}nav button.active{background:#eaf0e9;color:#265b40;font-weight:bold}nav button em{font-style:normal;font-size:17px;min-width:20px}.sidebottom{margin-top:auto;padding:18px 10px 0;font-size:11px;color:#637768}.sidebottom i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6a9268;margin-right:7px}.shell{margin-left:226px}header{height:75px;background:#fff;border-bottom:1px solid #e2e6df;display:flex;align-items:center;justify-content:space-between;padding:0 36px;font-size:12px;color:#8c968f}header span{margin:0 12px}header b{font-weight:500;color:#4f6257}.headright{display:flex;align-items:center;font-size:10px}.avatar{width:30px;height:30px;background:#e8eee4;color:#45623c;border-radius:50%;display:grid;place-items:center}main{padding:31px 36px;max-width:1600px;margin:auto;min-height:calc(100vh - 130px)}.title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:2.5px;color:#849180;margin-bottom:7px}h1{font-size:27px;letter-spacing:1px;margin:0 0 7px;font-weight:650}h2{font-size:16px;margin:0}h3{font-size:15px;margin:0 0 8px}.subtitle{color:#8a948b;font-size:12px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.hero{background:#e8eee4;border:1px solid #dae3d4;padding:23px 27px;border-radius:9px;display:flex;justify-content:space-between;gap:20px;margin-bottom:23px;position:relative;overflow:hidden}.hero h2{font-size:18px;margin-bottom:6px}.hero p{font-size:12px;color:#77856d;margin:0}.hero .blueprint{font-size:65px;color:#93aa88;line-height:1;letter-spacing:-14px;transform:rotate(-8deg);padding-right:30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin-bottom:28px}.stat{background:white;border:1px solid #e1e6de;border-radius:8px;padding:20px 23px}.stat small{color:#879282;font-size:11px}.stat strong{font:32px/1.6 Georgia,serif;display:block;color:#2c4d38}.stat .hint{font-size:10px;color:#9ba294}.stat.warning strong{color:#b18636}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sectionhead small{font-size:11px;color:#91a08e;margin-left:10px}.projectgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}.project{background:white;border:1px solid #dfe5da;border-radius:8px;padding:22px;position:relative;overflow:hidden}.project .code{font-size:10px;color:#9ba693;letter-spacing:1.6px;margin-bottom:14px}.project h3{font-size:17px}.project p{color:#899480;font-size:11px;margin:5px 0 20px}.project .meta{border-top:1px solid #edf0e9;padding-top:15px;display:flex;justify-content:space-between;font-size:11px;color:#72816a}.project .progress{height:4px;background:#edf1e9;margin:13px 0;border-radius:4px}.progress div{height:100%;background:#789c66;border-radius:4px}.project.add{border:1px dashed #cfd9c9;background:transparent;display:flex;min-height:210px;flex-direction:column;align-items:center;justify-content:center;color:#8c9d82;cursor:pointer}.project.add b{font-size:28px;font-weight:normal}.lower{display:grid;grid-template-columns:1.65fr 1fr;gap:22px}.panel{background:white;border:1px solid #e0e6dc;border-radius:8px;padding:23px}.task{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #edf0e9;align-items:center}.task:last-child{border:0}.task .num{color:#a7b39e;font:16px Georgia}.task .body{flex:1}.task b{font-size:12px;font-weight:500}.task small{display:block;font-size:10px;color:#98a28f;margin-top:3px}.badge{display:inline-block;border-radius:4px;font-size:10px;padding:3px 8px;white-space:nowrap;background:#f7efdc;color:#aa8435}.badge.ok{background:#e8f0e5;color:#52774b}.badge.blue{background:#eaf0f3;color:#64808d}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 17px}input,textarea,select{border:1px solid #dce3d7;border-radius:5px;background:#fff;color:#3d5142;padding:9px 11px;max-width:100%}input:focus,select:focus,textarea:focus{outline:2px solid #a1b797;outline-offset:1px}input.search{min-width:260px;flex:1}.tablewrap{overflow:auto;background:#fff;border:1px solid #dfe5da;border-radius:7px}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{font-size:10px;color:#8c9983;font-weight:500;background:#f9faf7;padding:14px 16px;white-space:nowrap}td{border-top:1px solid #e9eee3;padding:16px;vertical-align:top;min-width:95px}td.wide{min-width:230px;max-width:340px}td small{display:block;color:#9aa58f;font-size:10px;margin-top:5px}td button{font-size:11px}tr:hover td{background:#fcfdfb}.notice{background:#f3f0e6;border:1px solid #e8e1cc;color:#918153;padding:11px 16px;font-size:11px;border-radius:5px;margin-bottom:20px}.empty{padding:40px;text-align:center;color:#95a18d;font-size:12px}.pill{font-size:10px;color:#8e9b83;margin-left:8px}.topicrow{display:flex;justify-content:space-between;font-size:11px;margin:15px 0}.topicbar{height:5px;background:#eef2e9;flex:1;margin:7px 12px}.topicbar i{display:block;height:100%;background:#91ab80}footer{border-top:1px solid #e2e7dd;padding:15px 36px;font-size:9px;color:#9ba691;letter-spacing:1px;display:flex;justify-content:space-between}dialog{padding:0;border:1px solid #d7dfd0;border-radius:12px;box-shadow:0 25px 100px #10251833;width:min(920px,94vw);max-height:90vh}dialog::backdrop{background:#192c2866;backdrop-filter:blur(3px)}#modalbody{padding:27px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead button{padding:3px 10px;font-size:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#85917a}.field.full{grid-column:1/-1}.field textarea{height:86px;resize:vertical}.field input,.field select{width:100%}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:23px}.tabs{display:flex;gap:5px;margin-bottom:22px;border-bottom:1px solid #dfe7d8;padding-bottom:10px}.tabs button{border:0;font-size:12px}.tabs button.active{background:#e9efe4}.diff{display:grid;grid-template-columns:1fr 1fr;gap:20px}.diff pre{white-space:pre-wrap;font:12px/1.9 inherit;min-height:150px;padding:20px;background:#f6f8f2;border:1px solid #dfe7d5;border-radius:6px}.diff .old pre{background:#faf2eb}.history{border-top:1px solid #e1e8d9;margin-top:24px;padding-top:14px}.history summary{cursor:pointer}.history p{font-size:11px;color:#8c9880}.check{width:17px;height:17px;accent-color:#3f734b}.summaryblock{white-space:pre-wrap;padding:25px;background:white;border:1px solid #dde5d4;border-radius:8px;line-height:2;font-size:13px}.importtext{width:100%;min-height:170px;margin:12px 0}.candidate{display:flex;gap:10px;border-bottom:1px solid #e1e8d8;padding:10px 0}.candidate textarea{flex:1;height:65px;font-size:12px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#284c39;color:white;border-radius:7px;padding:12px 23px;display:none;z-index:10;font-size:12px}@media(max-width:1100px){.sidebar{width:190px;padding-inline:12px}.shell{margin-left:190px}main{padding:25px}.projectgrid{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr}.title{align-items:flex-start}.stats{gap:10px}.stat{padding:16px}}@media(max-width:720px){.sidebar{position:static;width:100%;padding:15px}.brand{font-size:24px}.brand b{font-size:20px}.workspace,.navlabel,.sidebottom{display:none}nav{display:flex;overflow:auto;margin-top:15px}nav button{width:auto;white-space:nowrap;font-size:11px;padding:8px}.shell{margin-left:0}header{padding:0 20px;height:55px}main{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.projectgrid{grid-template-columns:1fr}.title{flex-direction:column}h1{font-size:24px}.formgrid,.diff{grid-template-columns:1fr}.hero .blueprint{display:none}.field.full{grid-column:auto}footer span{display:none}}@media print{.sidebar,header,footer,.actions,.filters,button{display:none!important}.shell{margin:0}main{padding:0}.tablewrap{overflow:visible}body{background:white}}
</style></head><body><aside class="sidebar"><a class="brand" href="#">▥ <b>築規<span>ARCH / CODE</span></b></a><div class="workspace">設計研究工作室 <small>法規與基地工作台 · 單機版</small></div><div class="navlabel">工作空間</div><nav id="nav"></nav><div class="sidebottom"><i></i> 法規有據，設計有序<small>來源 · 版本 · 決策 · 追蹤</small></div></aside><div class="shell"><header><div>工作空間 <span>/</span> <b id="crumb">案件總覽</b></div><div class="headright"><button data-action="backup">備份 / 還原</button><span id="sync">載入本機資料…</span><span class="avatar">設</span></div></header><main id="main"></main><footer>築規 ARCH / CODE <span>每一個設計判斷，都有跡可循。</span></footer></div><dialog id="modal"><div id="modalbody"></div></dialog><div id="toast" role="status"></div><script>let records=[],view='overview',project='',topic='',status='',query='',busy=false;
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const topics=['都市計畫','土地使用分區','建築管理','停車','消防','無障礙','勘驗與使照','地方政府函釋'];
const states=['待確認','查詢中','已確認','需修正','不適用'];
const navs=[['overview','▦','案件總覽'],['rules','▤','法規查詢筆記'],['compare','⇄','條文版本比較'],['pending','◷','待確認清單'],['decisions','⌘','設計決策對照'],['checklist','☑','審查前檢查'],['sources','▧','引用來源管理'],['summary','◫','團隊討論摘要']];
const now=()=>new Date().toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),id=()=>crypto.randomUUID(),get=id=>records.find(x=>x.id===id),projects=()=>records.filter(x=>x.kind==='project'),rules=()=>records.filter(x=>x.kind==='rule'),sources=()=>records.filter(x=>x.kind==='source');
const pname=id=>get(id)?.name||'待確認',badge=s=>`<span class="badge ${s==='已確認'?'ok':s==='查詢中'?'blue':''}">${esc(s||'待確認')}</span>`,opts=(arr,val)=>arr.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('');
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4500)}
async function api(url,options={}){return localAPI(url,options)}
async function save(x){$('#sync').textContent='儲存中…';try{const y=await api('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});records=records.filter(r=>r.id!==y.id).concat(y);$('#sync').textContent='已儲存於本機';return y}catch(e){$('#sync').textContent='儲存失敗';throw e}}
function filtered(){return rules().filter(r=>(!project||r.project===project)&&(!topic||r.topic===topic)&&(!status||r.status===status)&&(!query||JSON.stringify(r).toLowerCase().includes(query.toLowerCase())))}
function go(v){view=v;render()}
function heading(title,sub,actions=''){return `<div class="title"><div><div class="eyebrow">ARCHITECTURE / REGULATION WORKSPACE</div><h1>${title}</h1><p class="subtitle">${sub}</p></div><div class="actions">${actions}</div></div>`}
const newrule=()=>'<button data-action="import">↥ 整理來源資料</button><button class="primary" data-action="newrule">＋ 新增法規項目</button>';
function filters(){return `<div class="filters"><input class="search" id="search" placeholder="搜尋條文、判讀、圖面或關鍵字…" value="${esc(query)}"><select id="pf" aria-label="案件篩選"><option value="">所有案件</option>${projects().map(p=>`<option value="${p.id}" ${project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="tf" aria-label="主題篩選"><option value="">所有法規主題</option>${opts(topics,topic)}</select><select id="sf" aria-label="狀態篩選"><option value="">所有狀態</option>${opts(states,status)}</select><button data-action="clear">重設</button><button data-action="csv">匯出 CSV ↓</button></div>`}
function overview(){const rr=rules(),pending=rr.filter(r=>!['已確認','不適用'].includes(r.status));return heading('案件總覽','從基地條件到設計決策，掌握每一項法規依據。','<button data-action="import">↥ 整理來源資料</button><button class="primary" data-action="newproject">＋ 新增案件</button>')+`<div class="hero"><div><div class="eyebrow">A CLEAR BASIS FOR EVERY DESIGN</div><h2>讓法規成為設計的清楚依據。</h2><p>集中整理來源與判讀，讓待確認的問題，逐一成為可追溯的決策。</p></div><div class="blueprint" aria-hidden="true">▱▥▤</div></div><div class="stats">${[['管理案件',projects().length,'持續累積基地知識'],['法規項目',rr.length,'串連條文與設計'],['待確認事項',pending.length,'優先完成適用性確認'],['引用來源',sources().length,'保存原始文件與網址']].map((x,i)=>`<div class="stat ${i===2?'warning':''}"><small>${x[0]} <span style="float:right">${['▦','▤','◷','▧'][i]}</span></small><strong>${x[1].toString().padStart(2,'0')}</strong><div class="hint">${x[2]}</div></div>`).join('')}</div><div class="sectionhead"><h2>案件工作區 <small>PROJECTS</small></h2><span class="pill">${projects().length} 個案件</span></div><div class="projectgrid">${projects().map((p,i)=>{let r=rr.filter(x=>x.project===p.id),ok=r.filter(x=>['已確認','不適用'].includes(x.status)).length;return `<article class="project"><div class="code">PROJECT ${String(i+1).padStart(2,'0')} <button class="link" style="float:right" data-edit="${p.id}">編輯 ↗</button></div><h3>${esc(p.name)}</h3><p>⌖ ${esc(p.location)} · ${esc(p.parcel)}</p><div class="meta"><span>${r.length} 項法規紀錄</span><span>${r.length-ok} 項待釐清</span></div><div class="progress"><div style="width:${r.length?100*ok/r.length:0}%"></div></div><div class="meta" style="border:0;padding:0"><span>${esc(p.stage||'基地研究')}</span><button class="link" data-openproject="${p.id}">進入案件 →</button></div></article>`}).join('')}<button class="project add" data-action="newproject"><b>＋</b>建立新的案件<small>從基地資訊開始整理</small></button></div><div class="lower"><section class="panel"><div class="sectionhead"><h2>優先釐清事項 <small>TO CONFIRM</small></h2><button class="link" data-go="pending">查看全部 →</button></div>${pending.slice(0,5).map((r,i)=>`<div class="task"><span class="num">0${i+1}</span><div class="body"><button class="link" data-edit="${r.id}">${esc(r.title)}</button><small>${esc(pname(r.project))} / ${esc(r.topic)} / ${esc(r.owner||'負責人待確認')}</small></div>${badge(r.status)}</div>`).join('')||'<div class="empty">目前沒有待確認事項</div>'}</section><section class="panel"><div class="sectionhead"><h2>法規主題分布 <small>TOPICS</small></h2></div>${topics.map(t=>{let n=rr.filter(x=>x.topic===t).length;return `<div class="topicrow"><span>${t}</span><div class="topicbar"><i style="width:${rr.length?n/rr.length*100:0}%"></i></div><span>${n.toString().padStart(2,'0')}</span></div>`}).join('')}</section></div>`}
function table(rows,mode='rules'){return `<div class="tablewrap"><table><thead><tr>${(mode==='decisions'?['案件 / 法規主題','適用條文與判讀','對設計的影響','圖面 / 審查項目','確認結果','操作']:mode==='checklist'?['完成','審查項目 / 法規','案件 / 主題','待補與確認事項','狀態','操作']:['法規主題 / 項目','案件','適用條文 / 版本','判讀與待確認事項','狀態','操作']).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${mode==='decisions'?`<td>${esc(pname(r.project))}<small>${esc(r.topic)}</small></td><td class="wide"><b>${esc(r.article)}</b><small>${esc(r.summary)}</small></td><td class="wide">${esc(r.impact)}</td><td>${esc(r.drawing)}</td><td>${esc(r.result)}<small>${badge(r.status)}</small></td>`:mode==='checklist'?`<td><input class="check" type="checkbox" data-check="${r.id}" aria-label="完成審查檢查" ${r.checked?'checked':''}></td><td class="wide">${esc(r.drawing)}<small>${esc(r.title)}</small></td><td>${esc(pname(r.project))}<small>${esc(r.topic)}</small></td><td class="wide">${esc(r.pending)}<small>負責：${esc(r.owner)} · 期限：${esc(r.due)}</small></td><td>${badge(r.status)}</td>`:`<td class="wide"><small style="margin:0 0 4px">${esc(r.topic)}</small><b>${esc(r.title)}</b></td><td>${esc(pname(r.project))}</td><td>${esc(r.article)}<small>版本 ${esc(r.version)}</small></td><td class="wide">${esc(r.summary)}<small>${esc(r.pending)}</small></td><td>${badge(r.status)}</td>`}<td><button class="link" data-edit="${r.id}">編輯 ↗</button><button class="link" data-comparerule="${r.id}">版本</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">沒有符合條件的項目，請調整篩選或新增紀錄。</td></tr>'}</tbody></table></div>`}
function render(){const title=navs.find(x=>x[0]===view)?.[2];$('#crumb').textContent=title;$('#nav').innerHTML=navs.map(n=>`<button class="${view===n[0]?'active':''}" data-go="${n[0]}"><em>${n[1]}</em>${n[2]}</button>`).join('');let html='';if(view==='overview')html=overview();else if(view==='sources')html=heading('引用來源管理','保留發布機關、原始文件與引用位置，讓判讀可以回溯。','<button data-action="import">↥ 整理來源資料</button><button class="primary" data-action="newsource">＋ 新增來源</button>')+`<div class="projectgrid">${sources().map(s=>`<article class="project"><div class="code">${esc(s.type)} · ${esc(s.date)}</div><h3>${esc(s.name)}</h3><p>${esc(s.agency)}<br>${esc(s.note)}</p><div class="actions">${link(s.url,'開啟原始來源 ↗')}${s.file?link(s.file,'下載文件 ↓'):''}<button class="link" data-edit="${s.id}">編輯</button></div><small>${rules().filter(r=>r.source===s.id).length} 個項目引用</small></article>`).join('')||'<div class="empty">尚無來源，新增網址、文件或會議紀錄開始整理。</div>'}</div>`;else if(view==='compare')html=heading('條文版本比較','比對原文、判讀與設計影響；每次儲存均保留歷史快照。')+`<div class="filters"><select id="compareRule"><option value="">選擇法規項目</option>${rules().map(r=>`<option value="${r.id}">${esc(pname(r.project)+' / '+r.title)}</option>`).join('')}</select></div><div id="comparison" class="panel"><div class="empty">選擇項目，查看版本歷程或貼上新舊條文進行比較。</div><button data-action="manualcompare">貼上兩段條文比較</button></div>`;else if(view==='summary')html=heading('團隊討論摘要','依目前篩選彙整已確認決策、設計影響與待辦事項。','<button data-action="md">匯出摘要 ↓</button><button data-action="print">列印 / PDF</button>')+filters()+`<div class="summaryblock">${esc(summary())}</div>`;else{const sub={rules:'集中管理法規依據、適用條文與查詢判讀。',pending:'釐清尚未確認的條件，留下負責人與後續確認結果。',decisions:'把每一項法規判讀，連結到具體的圖面與設計決策。',checklist:'在送審前逐項覆核；勾選完成不會自動變更法規確認狀態。'};let rows=filtered();if(view==='pending')rows=rows.filter(r=>!['已確認','不適用'].includes(r.status));html=heading(title,sub[view],newrule())+filters()+`<div class="notice">資料以原始公告及案件適用性確認為準。尚未查證的條文、版本與基地條件，均保留為「待確認」。</div>`+table(rows,view)}$('#main').innerHTML=html;bindFilters()}

function edit(kind,x={}){let f='';if(kind==='project')f=field('name','案件名稱',x.name)+field('location','基地位置',x.location)+field('parcel','地段 / 地號',x.parcel)+field('zone','土地使用分區',x.zone)+field('area','基地面積',x.area)+field('stage','案件階段',x.stage)+field('notes','基地條件 / 待確認事項',x.notes,'textarea');if(kind==='source')f=field('name','來源名稱',x.name)+field('type','來源類型',x.type||'政府網站','select',['政府網站','PDF 文件','會議紀錄','注意事項','其他'])+field('agency','發布機關 / 提供者',x.agency)+field('date','公告 / 版本日期',x.date)+field('url','來源網址',x.url)+field('file','已上傳文件連結',x.file)+field('note','來源說明與查詢筆記',x.note,'textarea');if(kind==='rule')f=field('project','所屬案件',x.project||project,'select',projects().map(p=>[p.id,p.name]))+field('topic','法規主題',x.topic||'建築管理','select',topics)+field('status','確認狀態',x.status||'待確認','select',states)+field('source','引用來源',x.source||'','select',[['','待確認'],...sources().map(s=>[s.id,s.name])])+rulefields.map(([k,l,t])=>field(k,l,x[k],t)).join('');modal(x.id?'編輯紀錄':'新增'+({rule:'法規項目',project:'案件',source:'來源'}[kind]),`<form id="editform"><div class="formgrid">${f}</div>${x.id&&kind==='rule'?`<details class="history"><summary>修改歷程（${x.history?.length||0}）</summary>${(x.history||[]).map(h=>`<p>${esc(h.at)} · ${esc(h.version)} · ${esc(h.status)}</p>`).reverse().join('')||'<p>尚無較早版本</p>'}</details>`:''}<div class="modalactions"><button type="button" data-action="close">取消</button><button class="primary" type="submit">儲存紀錄</button></div></form>`);$('#editform').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(!data.name?.trim()&&!data.title?.trim())return toast('請輸入名稱');if(kind==='rule'&&!data.project)return toast('請先新增案件');for(const k of Object.keys(data))if(!data[k].trim()&&!['source','url','file'].includes(k))data[k]='待確認';if(kind==='rule'&&data.status==='已確認'&&(!data.result||data.result==='待確認'))return toast('請填寫確認結果與依據，再標示已確認');try{const history=x.id?[...(x.history||[]),{...x,history:undefined,at:now()}]:[];await save({...x,...data,kind,id:x.id||id(),updated:now(),history});$('#modal').close();render();toast('已儲存，修改歷程已保留')}catch(e){toast(e.message)}}}
function showComparison(rid){const r=get(rid);if(!r)return;const versions=[...(r.history||[]),{...r,at:'目前版本'}];$('#comparison').innerHTML=`<h3>${esc(r.title)}</h3><div class="filters"><label>舊版 <select id="oldver">${versions.map((v,i)=>`<option value="${i}" ${i===Math.max(0,versions.length-2)?'selected':''}>${esc(v.version)} · ${esc(v.at)}</option>`).join('')}</select></label><label>新版 <select id="newver">${versions.map((v,i)=>`<option value="${i}" ${i===versions.length-1?'selected':''}>${esc(v.version)} · ${esc(v.at)}</option>`).join('')}</select></label><button class="link" data-edit="${r.id}">編輯並保留新版本</button></div><div id="diffbody"></div>`;function draw(){const a=versions[+$('#oldver').value],b=versions[+$('#newver').value];$('#diffbody').innerHTML=`${versions.length===1?'<div class="notice">目前只有一個版本，編輯儲存後即可比較歷史版本。</div>':''}<div class="diff">${[a,b].map((v,i)=>`<div class="${i===0?'old':''}"><h3>${i?'新版':'舊版'} · ${esc(v.version)}</h3>${['text','summary','impact','result'].map(k=>`<small>${{text:'條文原文',summary:'判讀摘要',impact:'設計影響',result:'確認結果'}[k]} ${a[k]!==b[k]?'<span class="badge">有變更</span>':''}</small><pre>${esc(v[k])}</pre>`).join('')}</div>`).join('')}</div>`}$('#oldver').onchange=draw;$('#newver').onchange=draw;draw()}
function summary(){const rs=filtered();return `案件法規與設計討論摘要\n產出時間：${now()}\n案件：${project?pname(project):'全部案件'}\n主題：${topic||'全部'}｜狀態：${status||'全部'}\n\n${rs.map((r,i)=>`${i+1}. ${r.title}｜${pname(r.project)}\n狀態：${r.status}；負責：${r.owner}；期限：${r.due}\n依據：${r.article}（${r.version}）\n來源：${get(r.source)?.name||'待確認'} ${r.url||get(r.source)?.url||''} ${r.citation}\n判讀：${r.summary}\n設計影響：${r.impact}\n圖面 / 審查：${r.drawing}\n待確認：${r.pending}\n確認結果：${r.result}\n`).join('\n')||'目前篩選下沒有紀錄。'}\n未確認項目應完成案件適用性覆核後再作為設計依據。`}

$('#split').onclick=()=>{let text=$('#importtext').value.trim();if(!text)return toast('請先貼上或擷取文字');const parts=text.split(/\n+/).map(x=>x.trim()).filter(x=>x.length>5);$('#candidates').innerHTML=`<h3>候選項目（${parts.length}）</h3><p class="subtitle">取消不需要的項目，可直接修改原文；每個項目建立後再補齊條號與設計判讀。</p>${parts.map((t,i)=>`<div class="candidate"><input type="checkbox" checked aria-label="選取候選項目 ${i+1}"><textarea>${esc(t)}</textarea></div>`).join('')}<div class="modalactions"><button class="primary" id="commitimport">儲存來源並建立選取項目</button></div>`;$('#commitimport').onclick=async()=>{if(busy)return;const pid=$('[name=importproject]').value;if(!pid)return toast('請先建立案件');const selected=[...document.querySelectorAll('.candidate')].filter(x=>x.querySelector('input').checked).map(x=>x.querySelector('textarea').value.trim()).filter(Boolean);if(!selected.length)return toast('請至少選擇一個候選項目');busy=true;$('#commitimport').disabled=true;let done=0;try{let uploaded;if(file){const fd=new FormData();fd.append('file',file);uploaded=await api('/api/upload',{method:'POST',body:fd})}const src=await save({id:id(),kind:'source',name:$('[name=importname]').value||'待確認',type:file?'PDF / 文件':$('[name=importurl]').value?'政府網站':'會議紀錄 / 注意事項',agency:'待確認',date:'待確認',url:$('[name=importurl]').value,file:uploaded?.url||'',note:text,updated:now()});for(const t of selected){const r={id:id(),kind:'rule',project:pid,source:src.id,topic:$('[name=importtopic]').value,status:'待確認',history:[],updated:now(),checked:false};rulefields.forEach(([k])=>r[k]='待確認');r.title=t.slice(0,45);r.text=t;r.url=src.url;r.pending='核對原文、條號、版本日期及案件適用性';await save(r);done++}$('#modal').close();view='rules';project=pid;render();toast(`已建立 ${done} 個待確認項目，原始來源已保存`)}catch(e){toast(`已建立 ${done} 項；${e.message}。請關閉並檢查已存資料後再補入剩餘項目。`)}finally{busy=false;if($('#commitimport'))$('#commitimport').disabled=false}}}}

const DATABASE='arch-code-offline-v1';
let dbPromise;
function openDB(){return dbPromise??=new Promise((resolve,reject)=>{const r=indexedDB.open(DATABASE,1);r.onupgradeneeded=()=>{r.result.createObjectStore('records',{keyPath:'id'});r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(Error('瀏覽器無法使用本機儲存，請改用一般模式的 Chrome 或 Edge。'))})}
async function allLocal(store){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function localAPI(url,options={}){
 if(url==='/api/records'&&!options.method)return allLocal('records');
 const db=await openDB();
 if(url==='/api/records') {const x=JSON.parse(options.body);return new Promise((resolve,reject)=>{const tx=db.transaction('records','readwrite'),s=tx.objectStore('records');let result;const r=s.get(x.id);r.onsuccess=()=>{const old=r.result;if(old&&old.revision!==x.revision){tx.abort();return}result={...x,revision:(old?.revision||0)+1};s.put(result)};tx.oncomplete=()=>resolve(result);tx.onabort=()=>reject(Error('儲存失敗或另一個分頁已修改資料，請重新整理後再試。'));tx.onerror=()=>reject(Error('本機儲存空間不足，請先匯出備份。'))})}
 if(url==='/api/upload'){const f=options.body.get('file');if(!f||f.size>15*1024*1024)throw Error('檔案上限 15MB');const key=id();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({id:key,name:f.name,type:f.type,blob:f});tx.oncomplete=()=>resolve({url:'localfile:'+key,name:f.name});tx.onerror=()=>reject(Error('附件儲存失敗，請檢查瀏覽器儲存空間'))})}
 throw Error('單機版不提供伺服器查詢功能');
}
function localLink(url,label){if(url?.startsWith('localfile:'))return `<button class="link" data-localfile="${esc(url.slice(10))}">${label}</button>`;const h=safeurl(url);return url&&h?`<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${label}</a>`:''}
async function fileBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)})}
async function backup(){const db=await openDB();const data=await new Promise((resolve,reject)=>{const tx=db.transaction(['records','files']);let a,b;const r=tx.objectStore('records').getAll(),f=tx.objectStore('files').getAll();r.onsuccess=()=>a=r.result;f.onsuccess=()=>b=f.result;tx.oncomplete=()=>resolve({records:a,files:b});tx.onerror=()=>reject(tx.error)});const files=[];for(const f of data.files)files.push({id:f.id,name:f.name,type:f.type,data:await fileBase64(f.blob)});download('築規備份-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:DATABASE,version:1,created:now(),records:data.records,files}),'application/json');toast('完整備份已下載，包含附件與修改歷程')}
function backupPanel(){modal('本機資料與備份',`<div class="notice">資料保存在目前瀏覽器。請固定使用同一瀏覽器與相同網頁檔案位置；清除瀏覽器資料、使用無痕模式或換電腦，可能造成資料無法取得。請定期下載完整備份。</div><h3>完整備份</h3><p>匯出所有案件、法規、來源、歷史版本與附件。換電腦時，開啟此網頁並匯入備份即可。</p><button class="primary" id="backupnow">下載完整備份 JSON</button><hr style="border:0;border-top:1px solid #e1e8d9;margin:24px 0"><h3>還原備份</h3><p>先讀取檔案檢查內容，再確認還原。還原會取代目前全部資料，請先下載備份。</p><input id="restorefile" type="file" accept=".json,application/json"><div id="restoreinfo"></div>`);$('#backupnow').onclick=()=>backup().catch(e=>toast(e.message));$('#restorefile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>250*1024*1024)throw Error('備份檔超過 250MB');const data=JSON.parse(await f.text());if(data.format!==DATABASE||data.version!==1||!Array.isArray(data.records)||!Array.isArray(data.files))throw Error('不是有效的築規單機版備份');const ids=new Set();for(const r of data.records){if(!r||typeof r.id!=='string'||ids.has(r.id)||!['project','rule','source'].includes(r.kind)||!Number.isInteger(r.revision)||r.revision<1)throw Error('備份資料格式不正確');ids.add(r.id)}const fileids=new Set();const files=data.files.map(f=>{if(typeof f.id!=='string'||fileids.has(f.id)||typeof f.name!=='string'||typeof f.data!=='string')throw Error('附件格式不正確');fileids.add(f.id);const bin=atob(f.data);return {...f,blob:new Blob([Uint8Array.from(bin,c=>c.charCodeAt(0))],{type:f.type||'application/octet-stream'}),data:undefined}});$('#restoreinfo').innerHTML=`<div class="notice" style="margin-top:20px">備份日期：${esc(data.created)}<br>${data.records.length} 筆紀錄、${files.length} 個附件。確認後取代目前資料。</div><label><input id="restoreagree" type="checkbox"> 我已備份目前資料，確認取代</label><div class="modalactions"><button id="restorego" class="primary">確認還原</button></div>`;$('#restorego').onclick=async()=>{if(!$('#restoreagree').checked)return toast('請先備份並勾選確認');$('#restorego').disabled=true;try{const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction(['records','files'],'readwrite');tx.objectStore('records').clear();tx.objectStore('files').clear();data.records.forEach(r=>tx.objectStore('records').put(r));files.forEach(f=>tx.objectStore('files').put(f));tx.oncomplete=resolve;tx.onerror=()=>reject(Error('還原失敗，原資料已保留'));tx.onabort=()=>reject(Error('還原未完成，原資料已保留'))});records=await allLocal('records');project=topic=status=query='';view='overview';$('#modal').close();render();toast('備份已完整還原')}catch(e){toast(e.message);$('#restorego').disabled=false}}}catch(e){$('#restoreinfo').textContent=e.message}}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='backup')backupPanel();if(b.dataset.localfile){try{const f=(await allLocal('files')).find(f=>f.id===b.dataset.localfile);if(!f)throw Error('找不到附件，請確認已還原完整備份');const u=URL.createObjectURL(f.blob),a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){toast(e.message)}}});

init();
</script></body></html>
